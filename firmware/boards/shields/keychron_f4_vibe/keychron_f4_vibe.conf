# USB-only F4 Vibe bring-up firmware.
CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_BOOT=y
CONFIG_USB_DEVICE_MANUFACTURER="Keychron"
CONFIG_ZMK_KEYBOARD_NAME="Keychron F4 Vibe"
CONFIG_USB_DEVICE_VID=0x3434
CONFIG_USB_DEVICE_PID=0x0F40
CONFIG_USB_DEVICE_REMOTE_WAKEUP=y
CONFIG_USB_HID_BOOT_PROTOCOL=y
CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_NET_BUF=y
CONFIG_USB_DEVICE_AUDIO=y
CONFIG_USB_MAX_POWER=100
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_KEYCHRON_FWU_STRING_NAME="KCZKF4V1"
CONFIG_ENABLE_HID_INT_OUT_EP=y
CONFIG_HID_INTERRUPT_EP_MPS=64
CONFIG_ZMK_LAUNCHER=n

CONFIG_GPIO=y
CONFIG_GPIO_ENABLE_DISABLE_INTERRUPT=y
CONFIG_REALTEK_USING_SDK_LIB=y
CONFIG_RTK_DFU=y
CONFIG_COUNTER=y
CONFIG_COUNTER_TIMER_RTL87X2G=y
CONFIG_WATCHDOG=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Keep this first hardware bring-up deliberately USB-only.
CONFIG_ZMK_BLE=n
CONFIG_ZMK_PPT=n
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_POLICY_CUSTOM=n
CONFIG_RUNTIME_NMI=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=600000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
